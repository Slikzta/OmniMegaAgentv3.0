name: Build Project Sierra Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (Current LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-build Diagnostics
        run: |
          echo "=== Initial Directory Listing ==="
          ls -la
          echo "=== Android Directory Check ==="
          if [ -d android ]; then
            echo "STATUS: android/ directory exists in repository."
            ls -la android
          else
            echo "STATUS: android/ directory does NOT exist. Self-healing generation will create it."
          fi
          echo "=== Capacitor Version Check ==="
          npx cap --version || echo "Capacitor CLI not installed yet"

      - name: Install Node and Capacitor Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Production Assets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run build

      - name: Ensure Android Platform Exists (Self-Healing)
        run: |
          if [ ! -d android ]; then
            echo "android/ directory not found. Adding Android platform via Capacitor..."
            npx cap add android
          else
            echo "android/ directory is present."
          fi

      - name: Sync Web Assets and Plugins to Android Project
        run: npx cap sync android

      - name: Apply Required AndroidManifest Permissions and Queries
        run: node scripts/patch-manifest.cjs

      - name: Setup Debug Keystore
        env:
          SECRET_DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          mkdir -p ~/.android
          if [ -n "$SECRET_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Using debug keystore from DEBUG_KEYSTORE_BASE64 secret..."
            echo "$SECRET_DEBUG_KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore
          elif [ -f android/app/debug.keystore.base64 ]; then
            echo "Decoding debug keystore from android/app/debug.keystore.base64..."
            base64 -d android/app/debug.keystore.base64 > android/app/debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > android/app/debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Copying debug keystore from debug.keystore..."
            cp debug.keystore android/app/debug.keystore
          fi
          # Also populate ~/.android/debug.keystore to guarantee consistency across all tools
          if [ -f android/app/debug.keystore ]; then
            cp android/app/debug.keystore ~/.android/debug.keystore
            echo "Persistent debug keystore installed successfully (size: $(wc -c < android/app/debug.keystore) bytes)."
          else
            echo "WARNING: No debug keystore source found!"
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools ndk;27.0.12077973 cmake;3.22.1'

      - name: Setup Fixed Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          if [ -n "$KEYSTORE_BASE64" ]; then
            if echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore" && \
               keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD"; then
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
              {
                echo "KEYSTORE_PASSWORD<<EOF_KEYSTORE_PASSWORD"
                printf '%s\n' "$KEYSTORE_PASSWORD"
                echo "EOF_KEYSTORE_PASSWORD"
                echo "KEY_ALIAS<<EOF_KEY_ALIAS"
                printf '%s\n' "$KEY_ALIAS"
                echo "EOF_KEY_ALIAS"
                echo "KEY_PASSWORD<<EOF_KEY_PASSWORD"
                printf '%s\n' "$KEY_PASSWORD"
                echo "EOF_KEY_PASSWORD"
              } >> "$GITHUB_ENV"
              echo "Configured fixed release keystore for APK signing."
            else
              rm -f "$RUNNER_TEMP/release.keystore"
              echo "::warning::Release keystore decode or keytool -list check failed (secret may be missing, truncated, or password mismatch); falling back to default debug keystore signing."
            fi
          else
            echo "KEYSTORE_BASE64 secret not set; falling back to default debug keystore signing."
          fi
          exit 0

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Environment Diagnostics
        working-directory: android
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          echo "=== Gradle Version ==="
          ./gradlew --version
          echo "=== Android SDK Root ==="
          echo "$ANDROID_HOME"
          echo "=== Installed Android Platforms ==="
          ls -la "$ANDROID_HOME/platforms" || true
          echo "=== Installed Android Build Tools ==="
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Build Debug APK
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          set +e
          LOG_FILE="$RUNNER_TEMP/gradle-build.log"
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3..."
            ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$LOG_FILE"
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -eq 0 ]; then
              exit 0
            fi
            if grep -qiE "status code 429|HTTP 429|Too Many Requests|Connection reset|Connection timed out|Read timed out|ConnectException|SocketTimeoutException|UnknownHostException|SSLException|Could not get resource|Could not HEAD|Could not GET|Temporary failure in name resolution|status code 502|status code 503|status code 504" "$LOG_FILE"; then
              if [ "$attempt" -lt 3 ]; then
                echo "Transient network or HTTP 429 error detected on attempt $attempt; waiting 60s before retry..."
                sleep 60
                continue
              fi
              echo "Gradle build failed after 3 attempts due to network or HTTP 429 errors."
              exit "$EXIT_CODE"
            else
              echo "Gradle build failed with non-network error (signing/compile/other); not retrying."
              exit "$EXIT_CODE"
            fi
          done

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sierra-omniagent-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
